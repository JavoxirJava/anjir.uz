<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Yandex Direct Search API</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            padding: 40px;
        }

        .box {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            background: #000;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #log {
            margin-top: 20px;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
            color: #10b981;
            border: 1px solid #10b981;
        }
    </style>
</head>

<body>

    <div class="box">
        <h3>Yandex Direct HTTP Request</h3>
        <input type="text" id="mapLink" placeholder="Yandex Maps URL qo'ying...">
        <button onclick="getDistrictData()">So'rov yuborish (Fetch)</button>
        <div id="log">Status: Kutilyapti...</div>
    </div>

    <script>
        async function getDistrictData() {
            const log = document.getElementById('log');
            const url = document.getElementById('mapLink').value;
            const apikey = "f5748c8b-dace-44f9-b5eb-85a3bc2e0f57"; // Sizning kalitingiz

            try {
                // 1. URL tahlili
                const llMatch = url.match(/ll=([^&]+)/);
                if (!llMatch) throw "URL'da koordinata (ll) topilmadi!";
                const ll = decodeURIComponent(llMatch[1]);

                log.innerText = "Yandex serveriga fetch yuborilmoqda...";

                // 2. HTTP so'rov (Geosearch API - bu tumanlarni aniqlashda eng kuchlisi)
                // results=1 va lang=uz_UZ parametrlari bilan
                const fetchUrl = `https://search-maps.yandex.ru/v1/?apikey=${apikey}&text=${ll}&lang=uz_UZ&type=geo&results=1`;

                console.log("Yuborilayotgan URL:", fetchUrl);

                const response = await fetch(fetchUrl);

                if (!response.ok) {
                    throw `Server xatosi: ${response.status}. Ehtimol kalitda cheklov bor?`;
                }

                const data = await response.json();

                // 3. Natijani tahlil qilish
                if (data.features && data.features.length > 0) {
                    const geo = data.features[0];
                    const result = {
                        tuman: geo.properties.name,
                        tavsif: geo.properties.description,
                        koordinata: geo.geometry.coordinates,
                        full_metadata: geo.properties.metaDataProperty.GeocoderMetaData
                    };
                    log.innerText = JSON.stringify(result, null, 4);
                    log.style.color = "#10b981";
                } else {
                    log.innerText = "Yandex bu nuqtada ma'muriy tuman topa olmadi.";
                    log.style.color = "#fbbf24";
                }

            } catch (e) {
                log.innerText = "XATO: " + e;
                log.style.color = "#ef4444";
                console.error(e);
            }
        }
    </script>

</body>

</html>
